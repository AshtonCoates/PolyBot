[project]
name = "polybot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.2.0",
    "marimo>=0.24.0",
    "mcp>=2.1.1",
    "pydantic-ai-slim>=2.35.3",
]

[project.scripts]
capture-gamestate = "polybot.capture.capture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polybot"]
